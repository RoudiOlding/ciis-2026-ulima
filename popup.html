<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; width: 320px; padding: 10px; }
        .btn-capturar { width: 100%; padding: 8px; background: #6c757d; color: white; border: none; border-radius: 5px; cursor: pointer; margin-bottom: 10px; }
        .btn-capturar:hover { background: #5a6268; }
        textarea { width: 100%; height: 80px; margin-bottom: 10px; padding: 5px; font-size: 13px; box-sizing: border-box; }
        .btn-procesar { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-procesar:hover { background: #0056b3; }
        .btn-procesar:disabled { background: #cccccc; cursor: not-allowed; }
        #resultado { margin-top: 15px; font-size: 14px; padding: 10px; background: #f4f4f4; border-radius: 5px; min-height: 60px; }
    </style>
</head>
<body>
    <h3>Aplicación de IA</h3>
    
    <button id="btn-capturar" class="btn-capturar">1. Capturar texto sombreado</button>
    
    <textarea id="texto-capturado" placeholder="Aquí aparecerá el texto que sombreaste..."></textarea>
    
    <button id="btn-procesar" class="btn-procesar" disabled>2. Procesar con IA</button>
    
    <div id="resultado">Esperando acción...</div>
    
    <script src="popup.js"></script>
</body>
</html>
